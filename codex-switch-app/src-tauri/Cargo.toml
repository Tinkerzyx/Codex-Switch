[package]
name = "codex-switch-app"
version = "1.8.1"
description = "Lightweight Codex profile switcher"
authors = ["Codex Switch"]
edition = "2021"

[lib]
name = "codex_switch_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = "0.4"
dirs = "6"
base64 = "0.22"
toml = "0.9"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSError", "NSSet", "NSString", "NSUUID"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebsiteDataStore", "WKWebsiteDataRecord"] }

