[package]
name = "codex-switch-app"
version = "0.1.0"
description = "Lightweight Codex profile switcher"
authors = ["Codex Switch"]
edition = "2021"

[lib]
name = "codex_switch_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
