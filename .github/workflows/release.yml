name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x86_64
            bundle: nsis
          - runner: macos-15
            target: darwin-aarch64
            bundle: app,dmg
          - runner: macos-15-intel
            target: darwin-x86_64
            bundle: app,dmg
    runs-on: ${{ matrix.runner }}
    env:
      CODEX_SWITCH_DATA_DIR: ${{ github.workspace }}/.test-output/runtime
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: codex-switch-app/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-switch-app/src-tauri
          shared-key: ${{ matrix.target }}
      - name: Require Apple signing for a tagged release
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        run: |
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD"
          test "$APPLE_SIGNING_IDENTITY" != '-'
          test -n "$APPLE_API_ISSUER" && test -n "$APPLE_API_KEY" && test -n "$APPLE_API_KEY_CONTENT"
      - name: Prepare notarization key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_CONTENT != ''
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/codex-switch-notarization.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: codex-switch-app
      - run: node scripts/version.mjs check
      - run: npm test
        working-directory: codex-switch-app
      - run: cargo test --locked --lib --manifest-path codex-switch-app/src-tauri/Cargo.toml
      - run: npm run build -- --ci --bundles ${{ matrix.bundle }}
        working-directory: codex-switch-app
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            codex-switch-app/src-tauri/target/release/bundle/nsis/*-setup.exe
            codex-switch-app/src-tauri/target/release/bundle/dmg/*.dmg
            release-output/*
  draft:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
      - name: Create one draft after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -d '' files < <(find release-files -type f \( -name '*.exe' -o -name '*.dmg' \) -print0)
          test "${#files[@]}" -eq 3
          gh release create "$RELEASE_TAG" "${files[@]}" --draft --title "Codex Switch ${RELEASE_TAG#v}" --generate-notes
